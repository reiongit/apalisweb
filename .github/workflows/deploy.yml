# Build the site and upload it to Hostinger (apalis.io) on every push to main.
#
# Required repository secrets (GitHub → Settings → Secrets and variables → Actions):
#   FTP_SERVER     Hostinger FTP host (hPanel → apalis.io → Files → FTP Accounts)
#   FTP_USERNAME   Hostinger FTP username, e.g. u123456789.apalis.io
#   FTP_PASSWORD   That FTP account's password
# Optional repository variable:
#   FTP_SERVER_DIR Folder to upload into, relative to the FTP login folder.
#                  Defaults to ./ because the apalis.io FTP account already opens
#                  inside public_html.

name: Deploy to apalis.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-apalis-io
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Check FTP secrets are set
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "::warning::FTP secrets not set — built the site but skipped the upload."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Hostinger
        if: steps.secrets.outputs.ready == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Hostinger's FTP server refuses FTPS data connections from this action
          # (425 Unable to build data connection), so upload over plain FTP.
          protocol: ftp
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          exclude: |
            **/.DS_Store
